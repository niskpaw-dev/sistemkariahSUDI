<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kariah - Surau Darul Iman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "surau-emerald": "#059669", "surau-emerald-dark": "#047857", "surau-cream": "#FDFBF7" }
                }
            }
        };
    </script>
    <style>
        .toast-hidden { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        .toast-visible { opacity: 1; transform: translateY(0); }
        input:focus { border-color: #059669 !important; ring: 2px #059669; }
    </style>
</head>
<body class="bg-surau-cream min-h-screen text-slate-800 font-sans">

    <main class="max-w-5xl mx-auto p-4 sm:p-8">
        <!-- HEADER -->
        <header id="publicHeader" class="text-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-3xl font-bold text-surau-emerald-dark">Sistem Kariah</h1>
            <p class="text-slate-500">Surau Darul Iman, Kanchong Darat</p>
            <div id="navTabs" class="flex justify-center gap-4 mt-6">
                <button onclick="switchTab('daftar')" id="tabDaftar" class="px-6 py-2 rounded-full bg-surau-emerald text-white font-bold">Pendaftaran</button>
                <button onclick="switchTab('status')" id="tabStatus" class="px-6 py-2 rounded-full bg-white border border-slate-200 text-slate-600">Semak Status</button>
            </div>
        </header>

        <!-- FORM PENDAFTARAN -->
        <section id="viewDaftar" class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <form id="kariahForm" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold mb-1">Nama Penuh (Seperti MyKad) *</label>
                        <input type="text" name="namaPenuh" required class="w-full p-3 border rounded-lg uppercase">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">No. MyKad *</label>
                        <input type="text" name="noMykad" id="noMykad" placeholder="XXXXXX-XX-XXXX" required class="w-full p-3 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">No. Telefon Bimbit *</label>
                        <input type="tel" name="noTelBimbit" required class="w-full p-3 border rounded-lg">
                    </div>
                </div>
                <button type="submit" id="btnSubmit" class="w-full bg-surau-emerald hover:bg-surau-emerald-dark text-white font-bold py-4 rounded-xl transition-all">Hantar Permohonan</button>
            </form>
        </section>

        <!-- VIEW SEMAK STATUS -->
        <section id="viewStatus" class="hidden max-w-md mx-auto bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <h2 class="text-xl font-bold mb-4 text-center">Semakan Status</h2>
            <input type="text" id="inputStatus" maxlength="4" placeholder="4 Digit Terakhir MyKad" class="w-full p-4 text-center text-2xl tracking-widest border-2 rounded-xl mb-4">
            <button onclick="checkStatus()" id="btnCheck" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold">Semak Rekod</button>
            <div id="statusResult" class="mt-6 space-y-3"></div>
        </section>

        <!-- ADMIN PANEL -->
        <section id="viewAdmin" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Panel Pentadbir</h2>
                <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-lg">Log Keluar</button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="p-4">Nama</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Tindakan</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="py-8 text-center text-slate-400 text-sm">
        &copy; 2026 Surau Darul Iman | <button onclick="showLogin()" class="underline">Admin</button>
    </footer>

    <!-- MODAL LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h3 class="text-lg font-bold mb-4 text-center">Akses Pentadbir</h3>
            <input type="password" id="adminPass" class="w-full p-3 border rounded-lg mb-4 text-center" placeholder="Kata Laluan">
            <button onclick="login()" id="btnLogin" class="w-full bg-surau-emerald text-white py-3 rounded-lg font-bold">Masuk</button>
            <button onclick="hideLogin()" class="w-full mt-2 text-slate-400 text-sm">Batal</button>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed top-4 right-4 bg-white border-l-4 border-surau-emerald shadow-lg p-4 rounded toast-hidden transition-all duration-300">
        <p id="toastMsg" class="font-bold text-sm"></p>
    </div>

    <script>
        // GANTIKAN URL INI DENGAN URL /exec ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbx_TAMPAL_URL_ANDA_DI_SINI/exec";
        
        let adminToken = sessionStorage.getItem('token');

        // Utils
        function showToast(msg, color = 'border-surau-emerald') {
            const t = document.getElementById('toast');
            t.className = `fixed top-4 right-4 bg-white border-l-4 ${color} shadow-lg p-4 rounded toast-visible transition-all duration-300`;
            document.getElementById('toastMsg').innerText = msg;
            setTimeout(() => t.classList.replace('toast-visible', 'toast-hidden'), 3000);
        }

        async function api(action, payload = {}) {
            const res = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action, ...payload })
            });
            const data = await res.json();
            if (data.error) throw new Error(data.error);
            return data;
        }

        // Tabs
        function switchTab(t) {
            document.getElementById('viewDaftar').classList.toggle('hidden', t !== 'daftar');
            document.getElementById('viewStatus').classList.toggle('hidden', t !== 'status');
            document.getElementById('tabDaftar').className = t === 'daftar' ? 'px-6 py-2 rounded-full bg-surau-emerald text-white font-bold' : 'px-6 py-2 rounded-full bg-white border border-slate-200 text-slate-600';
            document.getElementById('tabStatus').className = t === 'status' ? 'px-6 py-2 rounded-full bg-surau-emerald text-white font-bold' : 'px-6 py-2 rounded-full bg-white border border-slate-200 text-slate-600';
        }

        // Registration
        document.getElementById('kariahForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true; btn.innerText = "Menghantar...";
            try {
                const record = Object.fromEntries(new FormData(e.target));
                await api('register', { record });
                showToast("Pendaftaran Berjaya Dihantar!");
                e.target.reset();
            } catch (err) { showToast(err.message, 'border-red-500'); }
            finally { btn.disabled = false; btn.innerText = "Hantar Permohonan"; }
        };

        // Check Status
        async function checkStatus() {
            const digits = document.getElementById('inputStatus').value;
            const resDiv = document.getElementById('statusResult');
            try {
                const { results } = await api('checkStatus', { digits });
                resDiv.innerHTML = results.map(r => `
                    <div class="p-4 border rounded-lg bg-slate-50">
                        <p class="text-xs text-slate-400">NAMA: ${r.nama}</p>
                        <p class="font-bold">STATUS: ${r.status}</p>
                    </div>
                `).join('') || "Tiada rekod.";
            } catch (err) { showToast(err.message, 'border-red-500'); }
        }

        // Admin Auth
        function showLogin() { document.getElementById('loginModal').classList.replace('hidden', 'flex'); }
        function hideLogin() { document.getElementById('loginModal').classList.replace('flex', 'hidden'); }

        async function login() {
            const password = document.getElementById('adminPass').value;
            try {
                const { token } = await api('login', { password });
                adminToken = token;
                sessionStorage.setItem('token', token);
                hideLogin();
                loadAdmin();
            } catch (err) { showToast(err.message, 'border-red-500'); }
        }

        async function loadAdmin() {
            try {
                const { records } = await api('list', { token: adminToken });
                document.getElementById('publicHeader').classList.add('hidden');
                document.getElementById('viewDaftar').classList.add('hidden');
                document.getElementById('viewStatus').classList.add('hidden');
                document.getElementById('viewAdmin').classList.remove('hidden');
                
                const tbody = document.getElementById('adminTableBody');
                tbody.innerHTML = records.map(r => `
                    <tr class="border-b">
                        <td class="p-4 font-bold uppercase">${r.namaPenuh}</td>
                        <td class="p-4 text-sm">${r.status}</td>
                        <td class="p-4 text-right">
                            <button onclick="updateStatus('${r.id}', 'Disahkan')" class="text-emerald-600 mr-2">Sahkan</button>
                            <button onclick="deleteRec('${r.id}')" class="text-red-500">Padam</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) { 
                if(err.message === 'AUTH') logout();
                showToast(err.message, 'border-red-500'); 
            }
        }

        async function updateStatus(id, status) {
            await api('setStatus', { token: adminToken, id, status });
            loadAdmin();
        }

        async function deleteRec(id) {
            if(!confirm("Padam rekod?")) return;
            await api('remove', { token: adminToken, id });
            loadAdmin();
        }

        function logout() {
            sessionStorage.clear();
            location.reload();
        }

        // MyKad Format
        document.getElementById('noMykad').oninput = (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 6) v = v.slice(0,6) + '-' + v.slice(6);
            if (v.length > 9) v = v.slice(0,9) + '-' + v.slice(9,13);
            e.target.value = v;
        };

        // Auto-load if token exists
        if(adminToken) loadAdmin();

    </script>
</body>
</html>
